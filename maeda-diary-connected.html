;padding:32px;color:#92a7b1;font-size:12px}.danger{color:#ad5660}#status{font-size:12px;color:#7793a3}#error{color:#a44;white-space:pre-wrap}a{color:#4d83a1}@media(max-width:550px){.wrap{padding:14px}.hero{padding:26px 12px}.hero h1{font-size:25px}.logo{font-size:19px}}
</style></head><body><header><div class="wrap head"><div><div class="small">MAEDA FAMILY · LITTLE JOURNAL</div><div class="logo">ぼくたちの毎日。</div></div><button id="loginBtn">管理者ログイン</button></div></header><main class="wrap"><section class="hero"><div>☁ ✿ ☁</div><h1>ぼくたちの毎日。</h1><p>🐯 れんと、🦄 しのと、🌊 なぎと。<br>何気ない毎日が宝物。</p></section><div id="status"></div><div id="setup" class="notice hidden">このサイトはまだオンラインデータベースに接続されていません。<br>管理者が <code>config.js</code> にSupabaseの公開URLと公開キーを設定してください。秘密の鍵は入力しないでください。</div><nav id="nav"></nav><section id="content"></section><div class="foot">© MAEDA FAMILY · ぼくたちの毎日。</div></main><script src="config.js"></script><script>window.MAEDA_CONFIG={url:"https://wbonhlbphtrlyywxfuyx.supabase.co",anonKey:"sb_publishable_2W8prxxfz7j-Gp54aXvuRA_F_6qslmm"};</script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.MAEDA_CONFIG||{},configured=!!(cfg.url&&cfg.anonKey&&!cfg.url.includes('YOUR_'));let client=configured?createClient(cfg.url,cfg.anonKey):null,session=null,admin=false,tab='home',editId=null;
const initialKids=[{id:'ren',name:'れん',emoji:'🐯',age:7,birthday:'09-02',note:'大きくなったね。',photo:''},{id:'shino',name:'しの',emoji:'🦄',age:5,birthday:'10-23',note:'いつもにこにこ。',photo:''},{id:'nagi',name:'なぎ',emoji:'🌊',age:2,birthday:'02-14',note:'みんなの末っ子。',photo:''}];
let state={kids:initialKids,entries:[]};const $=x=>document.getElementById(x),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('sv-SE'),category=id=>id==='family'?'🏠 かぞく':(state.kids.find(k=>k.id===id)?.emoji||'')+' '+(state.kids.find(k=>k.id===id)?.name||'');
function say(s){$('status').textContent=s}function err(e){$('error')&&($('error').textContent=e?.message||String(e));say('エラーが発生しました')}function guard(){if(!admin)throw Error('管理者のみ編集できます')}
async function resolvePhoto(path){
 if(!path)return '';
 if(path.startsWith('data:')||path.startsWith('https://'))return path;
 const {data,error}=await client.storage.from('diary-photos').createSignedUrl(path,3600);
 return error?'':data.signedUrl;
}
async function load(){
 if(!client){say('設定が必要です');render();return}
 try{
  const [dr,kr]=await Promise.all([client.from('diary_entries').select('*').order('entry_date',{ascending:false}),client.from('children').select('*')]);
  if(dr.error)throw dr.error;if(kr.error)throw kr.error;
  state.kids=kr.data.map(k=>({...initialKids.find(x=>x.id===k.child_key),id:k.child_key,name:k.name,emoji:k.emoji,age:k.age,birthday:k.birthday,photo:'',note:''}));
  state.entries=dr.data.map(e=>({id:e.id,date:e.entry_date,title:e.title,body:e.body,category:e.child_key||'family',photo:e.photos?.[0]||''}));
  await Promise.all(state.entries.map(async e=>{e.photoUrl=await resolvePhoto(e.photo)}));
  say('日記を読み込みました');
 }catch(e){say('読み込みエラー: '+e.message)}
 render();
}
async function saveEntry(item){
 guard();const payload={entry_date:item.date,title:item.title,body:item.body,child_key:item.category==='family'?null:item.category,photos:item.photo?[item.photo]:[]};
 const result=item.id?await client.from('diary_entries').update(payload).eq('id',item.id):await client.from('diary_entries').insert(payload);
 if(result.error)throw result.error;
 say('保存しました ☁');await load();
}
async function uploadPhoto(file){
 guard();if(!file.type.startsWith('image/'))throw Error('画像を選択してください');
 if(file.size>6*1024*1024)throw Error('画像は6MB以下にしてください');
 const name=crypto.randomUUID()+'.jpg';const blob=await shrink(file);
 const {error}=await client.storage.from('diary-photos').upload(name,blob,{contentType:'image/jpeg',upsert:false});
 if(error)throw error;return name;
}
async function saveKid(k){
 guard();const {error}=await client.from('children').update({name:k.name,emoji:k.emoji,birthday:k.birthday,age:k.age}).eq('child_key',k.id);
 if(error)throw error;await load();
}
function entries(arr){return arr.length?arr.map(e=>`<article class="entry"><div class="muted">${escape(e.date)} · ${escape(category(e.category))}</div><h3>${escape(e.title)}</h3>${e.photo?`<img class="photo" src="${escape(e.photoUrl||e.photo)}" alt="日記の写真">`:''}<p>${escape(e.body)}</p>${admin?`<div class="actions"><button data-edit="${escape(e.id)}">編集</button><button class="danger" data-delete="${escape(e.id)}">削除</button></div>`:''}</article>`).join(''):'<div class="panel muted">まだ記録がありません。思い出を少しずつ残していこう ☁</div>'}
const sorted=()=>[...state.entries].sort((a,b)=>b.date.localeCompare(a.date));
function kids(){return `<div class="panel"><h2>こどもたち 🐯🦄🌊</h2><div class="kids">${state.kids.map(k=>`<div class="kid">${k.photo?`<img src="${escape(k.photo)}" alt="${escape(k.name)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px">`:`<div class="emoji">${escape(k.emoji)}</div>`}<strong>${escape(k.name)}</strong><div class="muted">${escape(k.age)}歳</div><div class="muted">${escape(k.birthday.replace('-','月'))}日</div>${admin?`<button data-kid="${escape(k.id)}">編集</button>`:''}</div>`).join('')}</div></div>`}
function render(){const tabs=[['home','ホーム'],['diary','育児日記'],['memories','7年間の思い出'],['album','アルバム'],['kids','こどもたち']];if(admin)tabs.push(['manage','管理']);$('nav').innerHTML=tabs.map(([id,t])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${t}</button>`).join('');$('loginBtn').textContent=admin?'ログアウト':'管理者ログイン';const newButton=admin?'<button class="primary" id="newEntry">＋ 日記を書く</button>':'';let html='';if(tab==='home')html=kids()+`<div class="panel row"><h2>最近の日記</h2>${newButton}</div>`+entries(sorted().slice(0,5));if(tab==='diary')html=`<div class="panel row"><h2>育児日記</h2>${newButton}</div>`+entries(sorted());if(tab==='memories'){let years=[...new Set([...Array.from({length:7},(_,i)=>String(2020+i)),...state.entries.map(e=>e.date.slice(0,4))])].sort();html=`<div class="panel row"><h2>7年間の思い出</h2>${newButton}</div>`+years.map(y=>`<div class="panel"><h2>${y}年</h2>${entries(sorted().filter(e=>e.date.startsWith(y)))}</div>`).join('')}if(tab==='album')html=`<div class="panel row"><h2>家族のアルバム</h2>${newButton}</div>`+entries(sorted().filter(e=>e.photo));if(tab==='kids')html=kids();if(tab==='manage'&&admin)html=`<div class="panel"><h2>管理者メニュー</h2><p class="muted">公開ページは閲覧専用です。ここでの変更はオンラインに保存されます。</p>${newButton}<div class="actions"><button id="backup">JSONバックアップ</button></div></div>`;if(!html)html=kids();$('content').innerHTML=html+'<div id="error"></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editEntry(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeEntry(b.dataset.delete));document.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>editKid(b.dataset.kid));$('newEntry')&&($('newEntry').onclick=()=>editEntry());$('backup')&&($('backup').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='maeda-diary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})}
function editEntry(id){if(!admin)return;const e=state.entries.find(x=>x.id===id)||{date:today(),category:'family',title:'',body:'',photo:''};$('content').innerHTML=`<div class="panel"><h2>${id?'日記を編集':'新しい日記'}</h2><form id="editForm"><div class="field"><label>日付</label><input type="date" id="date" required value="${escape(e.date)}"></div><div class="field"><label>カテゴリー</label><select id="category"><option value="family">🏠 かぞく</option>${state.kids.map(k=>`<option value="${escape(k.id)}">${escape(k.emoji+' '+k.name)}</option>`).join('')}</select></div><div class="field"><label>タイトル</label><input id="title" required maxlength="120" value="${escape(e.title)}"></div><div class="field"><label>本文</label><textarea id="body">${escape(e.body)}</textarea></div><div class="field"><label>写真（1枚・小さめの画像を推奨）</label><input type="file" id="photo" accept="image/*"></div><div class="actions"><button class="primary" type="submit">保存する</button><button type="button" id="cancel">戻る</button></div><div id="error"></div></form></div>`;$('category').value=e.category;$('cancel').onclick=render;$('editForm').onsubmit=async ev=>{ev.preventDefault();const button=$('editForm').querySelector('[type=submit]');button.disabled=true;try{let photo=e.photo;const file=$('photo').files[0];if(file)photo=await uploadPhoto(file);const item={id:id||null,date:$('date').value,category:$('category').value,title:$('title').value,body:$('body').value,photo};await saveEntry(item);tab='diary';render()}catch(ex){err(ex);button.disabled=false}}}
async function shrink(file){
 const url=URL.createObjectURL(file);
 try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
 const scale=Math.min(1,1600/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
 canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
 canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
 return await new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(Error('画像を処理できません')),'image/jpeg',.82));
 }finally{URL.revokeObjectURL(url)}
}
async function removeEntry(id){
 if(!admin||!confirm('削除しますか？'))return;
 try{const {error}=await client.from('diary_entries').delete().eq('id',id);if(error)throw error;await load()}catch(e){alert(e.message)}
}
function editKid(id){if(!admin)return;const k=state.kids.find(x=>x.id===id);$('content').innerHTML=`<div class="panel"><h2>${escape(k.emoji)} プロフィール編集</h2><form id="kidForm"><div class="field"><label>名前</label><input id="kn" required value="${escape(k.name)}"></div><div class="field"><label>年齢</label><input id="ka" type="number" min="0" required value="${escape(k.age)}"></div><div class="field"><label>誕生日（月日）</label><input id="kb" pattern="[0-9]{2}-[0-9]{2}" required value="${escape(k.birthday)}"></div><div class="field"><label>絵文字</label><input id="ke" required value="${escape(k.emoji)}"></div><div class="field"><label>ひとこと</label><textarea id="km">${escape(k.note)}</textarea></div><div class="actions"><button class="primary">保存する</button><button type="button" id="cancel">戻る</button></div><div id="error"></div></form></div>`;$('cancel').onclick=render;$('kidForm').onsubmit=async ev=>{ev.preventDefault();let old=structuredClone(state);try{Object.assign(k,{name:$('kn').value,age:Number($('ka').value),birthday:$('kb').value,emoji:$('ke').value,note:$('km').value,photo:k.photo});await saveKid(k);render()}catch(e){state=old;err(e)}}}
async function login(){if(!configured){alert('管理者の設定がまだ完了していません');return}if(admin){await client.auth.signOut();session=null;admin=false;tab='home';render();return}const email=prompt('管理者のメールアドレス');if(!email)return;const password=prompt('パスワード');if(password===null)return;const {error}=await client.auth.signInWithPassword({email,password});if(error)alert('ログインできません: '+error.message)}
$('loginBtn').onclick=login;
if(client){client.auth.onAuthStateChange(async(_event,s)=>{session=s;admin=false;if(s?.user){const {data,error}=await client.rpc('is_diary_admin');admin=data===true&&!error;if(!admin)say('このアカウントには編集権限がありません')}if(!admin&&tab==='manage')tab='home';await load()});}
await load();
</script></body></html>
