<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f4ed"><title>ぼくたちの毎日。｜育児日記</title><style>
:root{--bg:#f8f4ed;--paper:#fffdfa;--ink:#514a42;--sub:#92877a;--line:#e9e1d6;--accent:#b28e79}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:14px;line-height:1.8}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#fffcf7;border-bottom:1px solid var(--line)}.top{max-width:950px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.logo{font-family:Georgia,serif;font-size:24px;letter-spacing:.06em}.tiny{font-size:10px;letter-spacing:.17em;color:var(--sub)}.hero{max-width:950px;margin:35px auto 0;padding:0 22px}.banner{border-radius:9px;background:linear-gradient(125deg,#f1e5d8,#e6d4c5 48%,#f8ede0);height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.banner:before,.banner:after{content:'✿';position:absolute;font-size:130px;color:#ffffff66;transform:rotate(-18deg);left:4%;top:-40px}.banner:after{left:auto;right:5%;top:95px;font-size:90px}.banner-inner{text-align:center;z-index:1}.banner h1{font-size:31px;letter-spacing:.12em;font-weight:500;margin:5px 0}.banner p{font-size:12px;color:#796e64}.intro{padding:24px 0 8px;text-align:center;color:var(--sub);font-size:13px}.wrap{max-width:950px;margin:auto;padding:0 22px 70px}.nav{display:flex;gap:5px;border-bottom:1px solid var(--line);overflow-x:auto;margin:16px 0 27px}.nav button{border:0;background:none;color:var(--sub);padding:12px 18px;white-space:nowrap}.nav button.active{border-bottom:2px solid var(--accent);color:var(--ink);font-weight:bold}.layout{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:26px}.card{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:22px;margin-bottom:16px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.section-head h2{font-size:17px;font-weight:500;margin:0}.muted{color:var(--sub);font-size:12px}.entry{border-bottom:1px solid var(--line);padding:18px 0}.entry:first-of-type{padding-top:0}.entry:last-child{border-bottom:0;padding-bottom:0}.entry h3{font-size:16px;font-weight:500;margin:5px 0}.entry p{white-space:pre-line;margin:8px 0}.chip{display:inline-block;background:#f3eae0;color:#8c7566;border-radius:20px;padding:2px 10px;font-size:11px;margin-right:5px}.photo{background:linear-gradient(140deg,#f5e9d8,#e6d7c9);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#ab9786;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.entry-photo{height:180px;margin:12px 0}.profile-list{display:grid;gap:10px}.kid{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:6px;background:#fff}.avatar{width:54px;height:54px;flex-shrink:0;border-radius:50%;font-size:24px}.kid b{display:block}.kid small{color:var(--sub)}.btn{border:1px solid #bba28f;background:#b69a84;color:white;border-radius:5px;padding:8px 14px}.btn.light{background:white;color:#927864}.formfield{display:grid;gap:4px;margin:12px 0}.formfield input,.formfield textarea,.formfield select{border:1px solid var(--line);border-radius:5px;padding:10px;background:#fff;color:var(--ink);width:100%}textarea{min-height:120px;resize:vertical}.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.album .photo{aspect-ratio:1}.empty{text-align:center;color:var(--sub);padding:40px 10px}.footer{text-align:center;font-size:11px;color:var(--sub);margin-top:40px}.hidden{display:none!important}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}.filters button{border:1px solid var(--line);background:white;border-radius:18px;padding:4px 13px;color:var(--sub)}.filters button.selected{background:#b69a84;color:white;border-color:#b69a84}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{text-align:center;padding:10px 2px;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:12px;min-height:46px}.day.has{background:#f1e5d8;border-color:#d9c4b2}.day span{display:block;font-size:10px;color:#a88b78}.aside-title{font-size:12px;letter-spacing:.1em;color:#9e8572;margin-bottom:10px}.about{font-size:12px;color:var(--sub)}.notice{background:#f4eee7;padding:12px;border-radius:5px;font-size:12px;color:#857364}.delete{border:0;background:none;color:#a99a8e;font-size:11px;margin-left:8px}.photo-placeholder{font-size:38px} @media(max-width:700px){.layout{grid-template-columns:1fr}.side{order:-1}.side .card{padding:14px}.side .profile-list{grid-template-columns:repeat(3,1fr)}.side .kid{display:block;text-align:center;padding:10px 4px}.side .avatar{margin:0 auto 5px;width:48px;height:48px}.side .kid small{display:block;font-size:10px}.side .kid b{font-size:12px}.banner{height:185px}.banner h1{font-size:25px}.card{padding:17px}.top{padding:14px 18px}.logo{font-size:20px}.hero{margin-top:20px}.nav button{padding:10px 13px}.intro{font-size:12px}}
</style></head><body><header><div class="top"><div><div class="tiny">MAEDA FAMILY JOURNAL</div><div class="logo">ぼくたちの毎日。</div></div><span style="color:#b49b85;font-size:25px">✿</span></div></header><div class="hero"><div class="banner"><div class="banner-inner"><div class="tiny">OUR LITTLE DAYS</div><h1>ぼくたちの毎日。</h1><p>れん、しの、なぎ。小さな幸せの記録。</p></div></div><div class="intro">なんでもない一日が、いつか大切な思い出になりますように。</div></div><main class="wrap"><nav class="nav" id="nav"><button data-tab="home" class="active">ホーム</button><button data-tab="diary">育児日記</button><button data-tab="album">アルバム</button><button data-tab="calendar">カレンダー</button><button data-tab="write">日記を書く</button></nav><div class="layout"><div id="main"></div><aside class="side"><section class="card"><div class="aside-title">OUR CHILDREN</div><div class="profile-list"><div class="kid"><div class="photo avatar">☀</div><div><b>れん</b><small>6歳 · 長男</small></div></div><div class="kid"><div class="photo avatar">✿</div><div><b>しの</b><small>4歳 · 長女</small></div></div><div class="kid"><div class="photo avatar">☁</div><div><b>なぎ</b><small>1歳 · 次男</small></div></div></div></section><section class="card"><div class="aside-title">ABOUT THIS DIARY</div><div class="about">子どもたちとの日々を、少しずつ。<br>書いている人：ゆうし<br>ときどき、りくも登場します。</div></section></aside></div><div class="footer">© MAEDA FAMILY · MADE WITH LOVE</div></main><script>
const initial=[{id:1,date:'2026-10-19',kid:'なぎ',title:'今日も元気いっぱい',body:'朝からにこにこ。れんとしのが遊んでいると、なぎも一生懸命あとを追いかける。\n三人そろうと、家の中が急ににぎやかになる。',image:''},{id:2,date:'2026-10-12',kid:'しの',title:'しのの小さな宝物',body:'お散歩で拾った葉っぱを、大事そうに見せてくれた。\n「これ、ゆうしにあげる」って。ありがとう。',image:''},{id:3,date:'2026-10-05',kid:'れん',title:'お兄ちゃんの話',body:'今日あったことを、夕ごはんのあとにたくさん話してくれた。\nいつの間にか、こんなにおしゃべりが上手になったんだね。',image:''}];
const key='maeda-diary-v1';let entries;try{entries=JSON.parse(localStorage.getItem(key))||initial}catch{entries=initial}let tab='home',filter='すべて';const main=document.getElementById('main');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(entries))}function imageMarkup(e){return e.image?`<div class="photo entry-photo"><img src="${esc(e.image)}" alt="日記の写真"></div>`:''}function entryMarkup(e){return `<article class="entry"><div class="muted">${esc(e.date)} <span class="chip">${esc(e.kid)}</span></div><h3>${esc(e.title)}</h3>${imageMarkup(e)}<p>${esc(e.body)}</p>${e.id>100?`<button class="delete" data-delete="${e.id}">削除</button>`:''}</article>`}function filtered(){return [...entries].filter(e=>filter==='すべて'||e.kid===filter).sort((a,b)=>b.date.localeCompare(a.date))}function filters(){return `<div class="filters">${['すべて','れん','しの','なぎ','家族'].map(x=>`<button data-filter="${x}" class="${filter===x?'selected':''}">${x}</button>`).join('')}</div>`}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home'){main.innerHTML=`<section class="card"><div class="section-head"><h2>最近の日記</h2><button class="btn light" data-go="diary">すべて見る →</button></div>${filtered().slice(0,3).map(entryMarkup).join('')}</section><section class="card"><div class="section-head"><h2>この日々を残していく</h2></div><p>初めて笑った日も、泣いた日も。<br>大きくなったら、一緒に読み返そうね。</p><button class="btn" data-go="write">今日の日記を書く</button></section>`}else if(tab==='diary'){main.innerHTML=`<section class="card"><div class="section-head"><h2>育児日記</h2><span class="muted">${entries.length} 件の記録</span></div>${filters()}${filtered().length?filtered().map(entryMarkup).join(''):'<div class="empty">まだ日記がありません。</div>'}</section>`}else if(tab==='album'){const pics=entries.filter(e=>e.image);main.innerHTML=`<section class="card"><div class="section-head"><h2>アルバム</h2><span class="muted">${pics.length} 枚</span></div>${pics.length?`<div class="album">${pics.map(e=>`<div class="photo" title="${esc(e.title)}"><img src="${esc(e.image)}" alt="${esc(e.title)}"></div>`).join('')}</div>`:'<div class="empty"><div class="photo-placeholder">▧</div>日記に写真を添えると、ここに並びます。</div>'}</section>`}else if(tab==='calendar'){const today=new Date(),yr=today.getFullYear(),mo=today.getMonth(),first=new Date(yr,mo,1).getDay(),days=new Date(yr,mo+1,0).getDate();let cells=['日','月','火','水','木','金','土'].map(d=>`<div class="muted" style="text-align:center">${d}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let i=1;i<=days;i++){let d=`${yr}-${String(mo+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,n=entries.filter(e=>e.date===d).length;cells+=`<div class="day ${n?'has':''}">${i}${n?`<span>${n} 件</span>`:''}</div>`}main.innerHTML=`<section class="card"><div class="section-head"><h2>${yr}年 ${mo+1}月</h2></div><div class="calendar">${cells}</div><p class="muted">色のついた日は、日記を書いた日です。カレンダーは今月を表示します。</p></section>`}else{main.innerHTML=`<section class="card"><div class="section-head"><h2>日記を書く</h2></div><div class="notice">このブラウザに保存されます。別の端末には自動で同期されません。</div><form id="diary-form"><label class="formfield">日付<input name="date" type="date" required value="${new Date().toLocaleDateString('en-CA')}"></label><label class="formfield">カテゴリー<select name="kid"><option>れん</option><option>しの</option><option>なぎ</option><option>家族</option></select></label><label class="formfield">タイトル<input name="title" required maxlength="100" placeholder="今日の小さなできごと"></label><label class="formfield">今日の記録<textarea name="body" required placeholder="今日はどんな一日だった？"></textarea></label><label class="formfield">写真を選ぶ（任意）<input type="file" name="photo" accept="image/*"></label><p class="muted">写真は端末内に保存されます。大きな写真は自動で縮小します。</p><button class="btn" type="submit">日記を保存する</button></form></section>`}}document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-go],[data-filter],[data-delete]');if(!b)return;if(b.dataset.tab||b.dataset.go){tab=b.dataset.tab||b.dataset.go;filter='すべて';render();window.scrollTo({top:270,behavior:'smooth'})}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.delete){if(confirm('この日記を削除しますか？')){entries=entries.filter(x=>x.id!==Number(b.dataset.delete));save();render()}}});function shrink(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height,k=Math.min(1,1100/Math.max(w,h));let c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像を読み込めませんでした'))};img.src=url})}document.addEventListener('submit',async e=>{if(e.target.id!=='diary-form')return;e.preventDefault();let f=e.target,fd=new FormData(f);try{let image=await shrink(f.elements.photo.files[0]);entries.unshift({id:Date.now(),date:fd.get('date'),kid:fd.get('kid'),title:fd.get('title'),body:fd.get('body'),image});save();tab='diary';filter='すべて';render();alert('日記を保存しました。')}catch(err){alert('保存できませんでした。写真のサイズを減らして、もう一度お試しください。')}});render();
</script></body></html>
